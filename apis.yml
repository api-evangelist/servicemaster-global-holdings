description: 'ServiceMaster Global Holdings, Inc. (NYSE: SERV) was the Memphis-based parent company behind
  Terminix, ServiceMaster Restore, ServiceMaster Clean, Merry Maids, AmeriSpec and Furniture Medic — termite
  and pest control, disaster restoration, commercial and residential cleaning, home inspection and furniture
  repair, delivered largely through a franchise network. The company no longer exists under this name.
  On 1 October 2020 it sold the ServiceMaster Brands franchise business to Roark Capital for $1.553 billion,
  and later that month renamed itself Terminix Global Holdings, Inc., changing its NYSE ticker to TMX.
  Rentokil Initial plc completed its acquisition of Terminix Global Holdings in October 2022, absorbing
  the remaining pest-control business. The ServiceMaster brand itself continues under the independent,
  Roark-owned ServiceMaster Brands at servicemaster.com. Neither the historic holding company nor its
  successors publish a public developer program, API documentation, or a machine-readable contract of
  any kind.'
